<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- No remote origins: the three fonts are bundled (see src/main.tsx), so
         nothing here needs the network to render correctly. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self' https://api.anthropic.com" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Octo</title>
  </head>
  <body class="bg-ink-950 text-ink-100 font-sans antialiased">
    <!-- Boot splash — the same octopus samurai the app is made of
         (`OctoMascot`, state `work`, full detail), hand-inlined because this
         paints before the bundle: pure HTML/CSS, no script. App.tsx fades it
         out once the workspace is restored. The keyframes are a copy of the
         mascot block in styles.css — keep the two in sync. Colours are
         Signal's literals, not CSS variables (styles.css does not exist yet,
         and the CSP forbids the inline script that would read the persisted
         theme), so a non-default theme costs one brand-coloured frame. -->
    <style>
      @keyframes octo-squash { 0%, 100% { transform: translateY(0) scale(1.03, 0.97); } 45% { transform: translateY(-7px) scale(0.96, 1.05); } 70% { transform: translateY(-3px) scale(1, 1); } }
      @keyframes octo-tent-sway { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
      @keyframes octo-blink { 0%, 91%, 100% { transform: scaleY(1); } 93.5% { transform: scaleY(0.06); } 96% { transform: scaleY(1); } }
      @keyframes octo-blush { 0%, 100% { opacity: 0.32; } 50% { opacity: 0.6; } }
      @keyframes octo-lag { 0%, 100% { transform: translateY(1.3px) rotate(0.9deg); } 45% { transform: translateY(-1.3px) rotate(-0.9deg); } }
      @keyframes octo-lag-far { 0%, 100% { transform: translateY(2.2px) rotate(1.6deg); } 45% { transform: translateY(-2.2px) rotate(-1.6deg); } }
      @keyframes octo-cut { 0%, 52% { transform: rotate(0deg); } 60% { transform: rotate(-26deg); } 66% { transform: rotate(38deg); } 80% { transform: rotate(-4deg); } 100% { transform: rotate(0deg); } }
      @keyframes octo-slash { 0%, 60% { opacity: 0; stroke-dasharray: 0 200; } 66% { opacity: 0.9; stroke-dasharray: 130 200; } 84%, 100% { opacity: 0; stroke-dasharray: 130 200; } }
      @keyframes octo-dot-pulse { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
      #boot-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
        background: #1a1a1a; transition: opacity 320ms ease;
      }
      #boot-splash.done { opacity: 0; pointer-events: none; }
      #boot-splash .tent { transform-box: fill-box; transform-origin: 50% 0%; animation: octo-tent-sway 1.9s ease-in-out infinite; }
      #boot-splash .eyes { transform-box: view-box; transform-origin: 60px 56px; animation: octo-blink 4.4s infinite; }
      #boot-splash .blush { animation: octo-blush 2.8s ease-in-out infinite; }
      #boot-splash .crest { transform-box: view-box; transform-origin: 60px 50px; animation: octo-lag 2.4s ease-in-out infinite; animation-delay: -0.13s; }
      #boot-splash .shikoro { transform-box: view-box; transform-origin: 60px 58px; animation: octo-lag-far 2.4s ease-in-out infinite; animation-delay: -0.22s; }
      #boot-splash .sword { transform-box: view-box; transform-origin: 96px 88px; animation: octo-cut 2.8s cubic-bezier(0.2, 0, 0.05, 1) infinite; }
      #boot-splash .slash { animation: octo-slash 2.8s ease-out infinite; }
      #boot-splash .dot { width: 6px; height: 6px; border-radius: 0; background: #76b900; animation: octo-dot-pulse 1.2s infinite; }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .bob, #boot-splash .tent, #boot-splash .eyes, #boot-splash .blush,
        #boot-splash .crest, #boot-splash .shikoro, #boot-splash .sword, #boot-splash .slash,
        #boot-splash .dot { animation: none; }
      }
    </style>
    <div id="boot-splash">
      <div class="bob" style="animation: octo-squash 2.4s ease-in-out infinite; transform-origin: 50% 100%">
        <svg viewBox="0 0 120 122" width="112" height="114" style="overflow: visible; filter: drop-shadow(0 0 9px rgba(118, 185, 0, 0.4))">
          <!-- arms; the sixth holds the katana -->
          <path class="tent" d="M 31,88 C 26,99 24,108 29,112 C 32,114 35,111 34,107" fill="none" stroke="#8AD000" stroke-width="8" stroke-linecap="round" />
          <path class="tent" style="animation-delay: -0.5s" d="M 43,92 C 40,102 39,111 43,115" fill="none" stroke="#8AD000" stroke-width="7" stroke-linecap="round" />
          <path class="tent" style="animation-delay: -1s" d="M 55,94 C 54,104 53,112 56,116" fill="none" stroke="#8AD000" stroke-width="6.4" stroke-linecap="round" />
          <path class="tent" style="animation-delay: -1.5s" d="M 67,94 C 68,104 69,112 66,116" fill="none" stroke="#8AD000" stroke-width="6.4" stroke-linecap="round" />
          <path class="tent" style="animation-delay: -0.2s" d="M 79,92 C 82,102 83,111 79,115" fill="none" stroke="#8AD000" stroke-width="7" stroke-linecap="round" />
          <path class="tent" style="animation-delay: -0.9s" d="M 91,88 C 99,86 105,82 101,75" fill="none" stroke="#8AD000" stroke-width="7.6" stroke-linecap="round" />

          <!-- head -->
          <path d="M 24,80 C 24,38 40,18 60,18 C 80,18 96,38 96,80 C 96,89 84,94 60,94 C 36,94 24,89 24,80 Z" fill="#2A2A2A" stroke="#8AD000" stroke-width="3.5" stroke-linejoin="round" />
          <path d="M 96,80 C 96,38 80,18 60,18 C 74,27 84,46 84,80 C 84,88 76,92 62,93.6 C 84,93.4 96,89 96,80 Z" fill="#000" opacity="0.24" />
          <g class="blush">
            <ellipse cx="31" cy="72" rx="6" ry="3.6" fill="#76B900" />
            <ellipse cx="89" cy="72" rx="6" ry="3.6" fill="#76B900" />
          </g>
          <g class="eyes">
            <ellipse cx="43" cy="56" rx="11.5" ry="13.5" fill="#C4F06A" />
            <circle cx="39.4" cy="50.5" r="3.9" fill="#FAFAFA" />
            <circle cx="47.2" cy="61.5" r="2" fill="#FAFAFA" opacity="0.75" />
            <ellipse cx="77" cy="56" rx="11.5" ry="13.5" fill="#C4F06A" />
            <circle cx="73.4" cy="50.5" r="3.9" fill="#FAFAFA" />
            <circle cx="81.2" cy="61.5" r="2" fill="#FAFAFA" opacity="0.75" />
          </g>
          <path d="M 54,78 C 56.5,83 63.5,83 66,78" fill="none" stroke="#C4F06A" stroke-width="3" stroke-linecap="round" />

          <!-- chin guard, then the layered neck guard -->
          <path d="M 47,84 L 73,84 L 71,93 L 49,93 Z" fill="#1A1A1A" stroke="#8AD000" stroke-width="1.8" stroke-linejoin="round" />
          <path d="M 55,88 L 65,88" stroke="#C4F06A" stroke-width="1.4" opacity="0.8" />
          <g class="shikoro">
            <path d="M 23,59 L 9,62 L 7,72 L 23,70 Z" fill="#1A1A1A" stroke="#8AD000" stroke-width="1.6" stroke-linejoin="round" />
            <path d="M 97,59 L 111,62 L 113,72 L 97,70 Z" fill="#1A1A1A" stroke="#8AD000" stroke-width="1.6" stroke-linejoin="round" />
            <path d="M 23,70 L 7,73 L 6,84 L 24,81 Z" fill="#1A1A1A" stroke="#8AD000" stroke-width="1.6" stroke-linejoin="round" />
            <path d="M 97,70 L 113,73 L 114,84 L 96,81 Z" fill="#1A1A1A" stroke="#8AD000" stroke-width="1.6" stroke-linejoin="round" />
            <g stroke="#C4F06A" stroke-width="1.5" stroke-linecap="round" opacity="0.9">
              <path d="M 12,64 L 12,69 M 17,63 L 17,68 M 11,75 L 11,80 M 16,74 L 16,79" />
              <path d="M 108,64 L 108,69 M 103,63 L 103,68 M 109,75 L 109,80 M 104,74 L 104,79" />
            </g>
          </g>

          <!-- kabuto -->
          <g class="crest">
            <path d="M 25,45 L 11,41 L 9,59 L 24,59 Z" fill="#1A1A1A" stroke="#8AD000" stroke-width="1.8" stroke-linejoin="round" />
            <path d="M 95,45 L 109,41 L 111,59 L 96,59 Z" fill="#1A1A1A" stroke="#8AD000" stroke-width="1.8" stroke-linejoin="round" />
            <circle cx="16" cy="50" r="3.4" fill="#C4F06A" />
            <circle cx="104" cy="50" r="3.4" fill="#C4F06A" />
            <path d="M 25,50 C 25,29 40,15 60,15 C 80,15 95,29 95,50 Z" fill="#1A1A1A" stroke="#8AD000" stroke-width="2" stroke-linejoin="round" />
            <path d="M 60,15 L 60,49" stroke="#000" stroke-width="1.5" opacity="0.45" />
            <circle cx="60" cy="20" r="3.2" fill="#C4F06A" />
            <g fill="#C4F06A" opacity="0.85">
              <circle cx="38" cy="34" r="1.5" /><circle cx="47" cy="25" r="1.5" />
              <circle cx="73" cy="25" r="1.5" /><circle cx="82" cy="34" r="1.5" />
            </g>
            <path d="M 19,49 L 101,49 L 96,59 L 24,59 Z" fill="#1A1A1A" stroke="#8AD000" stroke-width="1.8" stroke-linejoin="round" />
            <path d="M 51,49 C 43,37 35,25 33,10 C 39,19 50,31 56,43 Z" fill="#C4F06A" />
            <path d="M 69,49 C 77,37 85,25 87,10 C 81,19 70,31 64,43 Z" fill="#C4F06A" />
            <circle cx="60" cy="44" r="5" fill="#1A1A1A" stroke="#C4F06A" stroke-width="1.6" />
          </g>

          <!-- the katana, drawn and cutting: booting is work -->
          <g class="sword" transform="rotate(-6 100 76)">
            <path d="M 97,79 L 103,74 L 119,20 L 113,17 Z" fill="#F2F2F2" stroke="#848484" stroke-width="1.4" stroke-linejoin="round" />
            <path d="M 100,76 L 115,20" stroke="#FAFAFA" stroke-width="1.2" opacity="0.85" />
            <path d="M 94,80 L 104,72 L 109,78 L 99,86 Z" fill="#C4F06A" />
            <path d="M 89,88 L 97,81 L 102,87 L 94,94 Z" fill="#1A1A1A" />
            <path d="M 91,88 L 96,93 M 94,85 L 99,90" stroke="#C4F06A" stroke-width="1.4" opacity="0.7" />
          </g>
          <path class="slash" d="M 30,26 C 56,8 90,10 112,30" fill="none" stroke="#FAFAFA" stroke-width="3" stroke-linecap="round" opacity="0" />
        </svg>
      </div>
      <div style="display: flex; gap: 6px; align-items: center">
        <div class="dot"></div>
        <div class="dot" style="animation-delay: 0.2s"></div>
        <div class="dot" style="animation-delay: 0.4s"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
