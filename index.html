<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- No remote origins: the three fonts are bundled (see src/main.tsx), so
         nothing here needs the network to render correctly. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self' https://api.anthropic.com" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Octo</title>
  </head>
  <body class="bg-ink-950 text-ink-100 font-sans antialiased">
    <!-- Boot splash — Mochi, the creature the app is made of (`OctoMascot`,
         state `work`, full detail), hand-inlined because this paints before the
         bundle: pure HTML/CSS, no script. App.tsx fades it out once the
         workspace is restored. The keyframes are a copy of the mascot block in
         styles.css — keep the two in sync. The light behind the visor is
         Signal's literal (#C4F06A, `--accent-num`), not a CSS variable
         (styles.css does not exist yet, and the CSP forbids the inline script
         that would read the persisted theme), so a non-default theme costs one
         brand-coloured frame. Mochi's body colours are literals everywhere. -->
    <style>
      @keyframes octo-squash { 0%, 100% { transform: translateY(0) scale(1.03, 0.97); } 45% { transform: translateY(-7px) scale(0.96, 1.05); } 70% { transform: translateY(-3px) scale(1, 1); } }
      @keyframes mochi-scan { from { transform: translateX(-20px); } to { transform: translateX(104px); } }
      @keyframes mochi-led { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
      @keyframes mochi-flow { to { stroke-dashoffset: -16; } }
      @keyframes octo-dot-pulse { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
      #boot-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
        background: #1a1a1a; transition: opacity 320ms ease;
      }
      #boot-splash.done { opacity: 0; pointer-events: none; }
      #boot-splash .scan { animation: mochi-scan 1.1s linear infinite; }
      #boot-splash .led { animation: mochi-led 0.5s ease-in-out infinite; }
      #boot-splash .flow { animation: mochi-flow 1.4s linear infinite; }
      #boot-splash .dot { width: 6px; height: 6px; border-radius: 0; background: #76b900; animation: octo-dot-pulse 1.2s infinite; }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .bob, #boot-splash .scan, #boot-splash .led, #boot-splash .flow,
        #boot-splash .dot { animation: none; }
      }
    </style>
    <div id="boot-splash">
      <div class="bob" style="animation: octo-squash 2.4s ease-in-out infinite; transform-origin: 50% 100%">
        <svg viewBox="0 0 200 200" width="120" height="120" style="overflow: visible">
          <defs>
            <linearGradient id="bs-skin" x1="100" y1="62" x2="100" y2="173" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#FFFBFF" /><stop offset="0.6" stop-color="#EDE4FF" /><stop offset="1" stop-color="#C4B3EE" />
            </linearGradient>
            <linearGradient id="bs-rim" x1="30" y1="110" x2="170" y2="110" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#3EF0FF" stop-opacity="0.9" /><stop offset="1" stop-color="#FF3EA5" stop-opacity="0.9" />
            </linearGradient>
            <clipPath id="bs-visor"><rect x="50" y="90" width="100" height="38" rx="19" /></clipPath>
            <filter id="bs-glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" /></filter>
            <filter id="bs-halo" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14" /></filter>
          </defs>
          <!-- glow and floor shadow -->
          <ellipse cx="100" cy="128" rx="64" ry="46" fill="#C4F06A" opacity="0.3" filter="url(#bs-halo)" />
          <ellipse cx="100" cy="177" rx="62" ry="6" fill="#C4F06A" opacity="0.4" />
          <!-- antenna and LED -->
          <path d="M 110,64 C 112,52 116,46 124,40" fill="none" stroke="#2E2850" stroke-width="3.2" stroke-linecap="round" />
          <g class="led"><circle cx="125" cy="39" r="9" fill="#C4F06A" opacity="0.28" /><circle cx="125" cy="39" r="4.6" fill="#C4F06A" /></g>
          <!-- body -->
          <path d="M 30,150 C 30,96 60,62 100,62 C 140,62 170,96 170,150 C 170,168 150,173 100,173 C 50,173 30,168 30,150 Z" fill="url(#bs-skin)" stroke="url(#bs-rim)" stroke-width="2.6" />
          <ellipse cx="68" cy="82" rx="13" ry="5.5" fill="#fff" opacity="0.9" transform="rotate(-30 68 82)" />
          <!-- circuits, data port, cheeks -->
          <path class="flow" d="M 38,152 L 52,152 L 60,160 L 72,160 M 162,152 L 148,152 L 140,160 L 128,160" fill="none" stroke="#2FD6E8" stroke-width="1.7" stroke-dasharray="5 3" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
          <circle cx="72" cy="160" r="2.4" fill="#2FD6E8" /><circle cx="128" cy="160" r="2.4" fill="#2FD6E8" />
          <rect x="164" y="122" width="9" height="17" rx="2.5" fill="#2E2850" />
          <rect x="166" y="125" width="5" height="3" rx="1" fill="#3EF0FF" /><rect x="166" y="131" width="5" height="3" rx="1" fill="#FF3EA5" />
          <rect x="55" y="134" width="15" height="5" rx="2.5" fill="#FF3EA5" opacity="0.6" />
          <rect x="130" y="134" width="15" height="5" rx="2.5" fill="#FF3EA5" opacity="0.6" />
          <!-- visor, scanning: booting is work -->
          <rect x="50" y="90" width="100" height="38" rx="19" fill="#120F22" stroke="#2E2850" stroke-width="2" />
          <g clip-path="url(#bs-visor)">
            <g filter="url(#bs-glow)">
              <rect class="scan" x="50" y="90" width="16" height="38" fill="#C4F06A" opacity="0.35" />
              <rect x="73" y="104" width="14" height="9" rx="3" fill="#C4F06A" /><rect x="113" y="104" width="14" height="9" rx="3" fill="#C4F06A" />
            </g>
            <rect class="scan" x="50" y="90" width="16" height="38" fill="#C4F06A" opacity="0.35" />
            <rect x="73" y="104" width="14" height="9" rx="3" fill="#C4F06A" /><rect x="113" y="104" width="14" height="9" rx="3" fill="#C4F06A" />
          </g>
          <path d="M 62,96 L 82,96" stroke="#fff" stroke-opacity="0.22" stroke-width="2" stroke-linecap="round" />
          <path d="M 92,140 Q 96,144 100,140 Q 104,144 108,140" fill="none" stroke="#4A3F6B" stroke-width="2.6" stroke-linecap="round" />
        </svg>
      </div>
      <div style="display: flex; gap: 6px; align-items: center">
        <div class="dot"></div>
        <div class="dot" style="animation-delay: 0.2s"></div>
        <div class="dot" style="animation-delay: 0.4s"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
