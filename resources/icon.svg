<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- App icon: the Octopus Brand Kit mark on the kit's app tile.
       Rasterize with `npm run icon` (scripts/render-icon.mjs) after editing. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#001224"/>
      <stop offset="1" stop-color="#001A33"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00BBDD"/>
      <stop offset="1" stop-color="#003973"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#001A33"/>
      <stop offset="1" stop-color="#000A14"/>
    </linearGradient>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="222" fill="url(#tile)"/>
  <rect x="103" y="103" width="818" height="818" rx="219" fill="none" stroke="rgba(0,187,221,0.25)" stroke-width="6"/>

  <svg x="232" y="162" width="560" height="700" viewBox="40 24 120 150" overflow="visible">
