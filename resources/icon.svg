    <path d="M 100,114 C 100,134 98,152 102,166" fill="none" stroke="url(#rim)" stroke-width="8" stroke-linecap="round"/>
    <path d="M 120,112 C 124,132 126,148 120,162" fill="none" stroke="url(#rim)" stroke-width="8" stroke-linecap="round"/>
    <path d="M 138,106 C 146,124 150,138 142,150" fill="none" stroke="url(#rim)" stroke-width="8" stroke-linecap="round"/>
    <path d="M 55,112 C 46,68 62,36 100,32 C 138,36 154,68 145,112 L 134,120 L 125,108 L 112,122 L 100,112 L 88,122 L 75,108 L 66,120 Z" fill="url(#body)" stroke="url(#rim)" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 72,68 L 92,76 L 92,84 L 72,76 Z" fill="#7DF3FF"/>
    <path d="M 128,68 L 108,76 L 108,84 L 128,76 Z" fill="#7DF3FF"/>
