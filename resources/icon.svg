<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- 0ct0 app icon: Mochi (OctoMascot, shared with Cross) on a Signal tile.
       The tile keeps the palette's primary-button treatment — brand green as
       fill — because at 32px in a dock a dark tile with a thin rim disappears.

       Drawn at OctoMascot's `simple` level: body, antenna, visor, eyes, cheeks
       and mouth. The halo blur is left out (on a green tile it only muddies the
       silhouette), and the rim is a #0F1400 outline under Mochi's own
       cyan-to-magenta one, so the lavender body still separates from the tile
       when the icon is 16px tall. The eyes take Signal's work light, #C4F06A.

       The rounded corner is the one exception to Signal's radius 0 — it is the
       silhouette macOS imposes, not a brand decision.
       Rasterize with `npm run icon` (scripts/render-icon.mjs) after editing. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8AD000"/>
      <stop offset="1" stop-color="#76B900"/>
    </linearGradient>
    <linearGradient id="skin" x1="100" y1="62" x2="100" y2="173" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFBFF"/>
      <stop offset="0.6" stop-color="#EDE4FF"/>
      <stop offset="1" stop-color="#C4B3EE"/>
    </linearGradient>
    <linearGradient id="rim" x1="30" y1="110" x2="170" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3EF0FF"/>
      <stop offset="1" stop-color="#FF3EA5"/>
    </linearGradient>
    <clipPath id="visor"><rect x="50" y="90" width="100" height="38" rx="19"/></clipPath>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="222" fill="url(#tile)"/>
  <rect x="103" y="103" width="818" height="818" rx="219" fill="none" stroke="rgba(15,20,0,0.28)" stroke-width="6"/>

  <!-- OctoMascot's viewBox is 0 0 200 200; Mochi spans x 28..172, y 30..183. -->
  <svg x="212" y="200" width="600" height="600" viewBox="0 0 200 200">
    <!-- floor shadow -->
    <ellipse cx="100" cy="178" rx="64" ry="7" fill="#0F1400" opacity="0.3"/>

    <!-- antenna and LED -->
    <path d="M 110,64 C 112,52 116,46 124,40" fill="none" stroke="#0F1400" stroke-width="5" stroke-linecap="round"/>
    <circle cx="125" cy="39" r="10" fill="#0F1400"/>
    <circle cx="125" cy="39" r="6" fill="#C4F06A"/>

    <!-- body: dark outline first, then Mochi's own rim -->
    <path d="M 30,150 C 30,96 60,62 100,62 C 140,62 170,96 170,150 C 170,168 150,173 100,173 C 50,173 30,168 30,150 Z" fill="none" stroke="#0F1400" stroke-width="9"/>
    <path d="M 30,150 C 30,96 60,62 100,62 C 140,62 170,96 170,150 C 170,168 150,173 100,173 C 50,173 30,168 30,150 Z" fill="url(#skin)" stroke="url(#rim)" stroke-width="3.6"/>
    <ellipse cx="68" cy="82" rx="13" ry="5.5" fill="#fff" opacity="0.9" transform="rotate(-30 68 82)"/>

    <!-- cheeks and data port -->
    <rect x="55" y="134" width="15" height="5" rx="2.5" fill="#FF3EA5" opacity="0.7"/>
    <rect x="130" y="134" width="15" height="5" rx="2.5" fill="#FF3EA5" opacity="0.7"/>
    <rect x="164" y="122" width="9" height="17" rx="2.5" fill="#2E2850"/>
    <rect x="166" y="125" width="5" height="3" rx="1" fill="#3EF0FF"/>
    <rect x="166" y="131" width="5" height="3" rx="1" fill="#FF3EA5"/>

    <!-- visor and eyes -->
    <rect x="50" y="90" width="100" height="38" rx="19" fill="#120F22" stroke="#2E2850" stroke-width="2.4"/>
    <g clip-path="url(#visor)">
      <g filter="url(#glow)" fill="#C4F06A">
        <rect x="74" y="100" width="12" height="18" rx="5"/>
        <rect x="114" y="100" width="12" height="18" rx="5"/>
      </g>
      <g fill="#C4F06A">
        <rect x="74" y="100" width="12" height="18" rx="5"/>
        <rect x="114" y="100" width="12" height="18" rx="5"/>
      </g>
    </g>
    <path d="M 62,96 L 82,96" stroke="#fff" stroke-opacity="0.25" stroke-width="2" stroke-linecap="round"/>

    <!-- mouth -->
    <path d="M 92,140 Q 96,144 100,140 Q 104,144 108,140" fill="none" stroke="#4A3F6B" stroke-width="2.8" stroke-linecap="round"/>
  </svg>
</svg>
